<header class="modulex-ust-miknatis{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-ust-miknatis-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</header>

<style>
  /* ust-miknatis — Hover tepkisi sabit bir stil değişimi değil, imleç konumuna göre fiziksel çekim (manyetik düğme): öğe imleci izler — yaratıcı ajans/tasarım stüdyosu dili. */
  .modulex-ust-miknatis { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-miknatis *, .modulex-ust-miknatis *::before, .modulex-ust-miknatis *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-miknatis :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-miknatis :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-miknatis :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-miknatis :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-miknatis img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-miknatis) img { height: auto; }
  .modulex-ust-miknatis [hidden] { display: none !important; }
  .modulex-ust-miknatis :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-miknatis :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-miknatis-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-miknatis-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ust-miknatis--bassiz .modulex-ust-miknatis-bas { display: none; }
  .modulex-ust-miknatis-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ust-miknatis-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ust-miknatis-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-miknatis-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-miknatis-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-miknatis-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-miknatis-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-miknatis-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ust-miknatis-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ust-miknatis { position: relative; z-index: 900; }
  .modulex-ust-miknatis-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-miknatis-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-miknatis-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-miknatis-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-miknatis-oge:hover, .modulex-ust-miknatis-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-miknatis-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-miknatis-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-miknatis-cta .material-symbols-outlined, .modulex-ust-miknatis-tel .material-symbols-outlined, .modulex-ust-miknatis-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-miknatis-tel, .modulex-ust-miknatis-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-miknatis-tel:hover, .modulex-ust-miknatis-posta:hover { color: --accentInk--; }
  .modulex-ust-miknatis-dil:empty { display: none; }
  .modulex-ust-miknatis-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-miknatis-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-miknatis-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-miknatis--acik .modulex-ust-miknatis-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-miknatis--acik .modulex-ust-miknatis-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-miknatis--acik .modulex-ust-miknatis-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-miknatis-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-miknatis-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-miknatis-sol 0.3s ease both; }
  @keyframes modulex-ust-miknatis-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-miknatis-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-miknatis--js .modulex-ust-miknatis-nav, .modulex-ust-miknatis--js .modulex-ust-miknatis-genis { display: none; }
    .modulex-ust-miknatis--js .modulex-ust-miknatis-ac { display: inline-flex; }
    .modulex-ust-miknatis-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-miknatis-in 0.3s ease both; }
    .modulex-ust-miknatis-pliste { display: grid; }
    .modulex-ust-miknatis-pliste .modulex-ust-miknatis-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-miknatis-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-miknatis-panel { display: none !important; }
  }
  @keyframes modulex-ust-miknatis-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modulex-ust-miknatis-manyetik { display: flex; align-items: center; justify-content: space-between; gap: 14px 26px; padding-block: 14px; }
  .modulex-ust-miknatis-cekim { display: flex; flex-wrap: wrap; }
  .modulex-ust-miknatis-mik { padding: 4px; }
  .modulex-ust-miknatis-mik-a { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding-inline: 20px; border-radius: 999px; color: inherit; font-weight: 700; text-decoration: none; isolation: isolate; transform: translate(var(--mx, 0px), var(--my, 0px)); transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.25, 1.4), color 0.25s ease; }
  .modulex-ust-miknatis-mik-a::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background-color: color-mix(in srgb, --accent-- 16%, --bg--); opacity: 0; transform: scale(0.4); transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.25, 1.4), opacity 0.25s ease; }
  .modulex-ust-miknatis-mik-a:hover::before, .modulex-ust-miknatis-mik-a:focus-visible::before { opacity: 1; transform: none; }
  .modulex-ust-miknatis-mik-ic { display: block; transform: translate(calc(var(--mx, 0px) * 0.45), calc(var(--my, 0px) * 0.45)); transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.25, 1.4); }
  .modulex-ust-miknatis-mik-a[aria-current="page"] { background-color: --text--; color: --bg--; }
  .modulex-ust-miknatis-mik-a[aria-current="page"]::before { display: none; }
  .modulex-ust-miknatis--mk .modulex-ust-miknatis-mik-a:active { transform: translate(var(--mx, 0px), var(--my, 0px)) scale(0.95); }
  .modulex-ust-miknatis-genis { display: flex; align-items: center; gap: 12px; }
  @media (max-width: 1024px) {
    .modulex-ust-miknatis:not(.modulex-ust-miknatis--js) .modulex-ust-miknatis-manyetik { flex-wrap: wrap; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-miknatis :is(.modulex-ust-miknatis-baslik, .modulex-ust-miknatis-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-miknatis-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-miknatis { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-miknatis *, .modulex-ust-miknatis *::before, .modulex-ust-miknatis *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-miknatis";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    const miknatis = (s, P, az) => {
        if (az || !window.matchMedia || !window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
        const ogeler = [...s.querySelectorAll("." + P + "-mik")];
        if (!ogeler.length) return;
        s.classList.add(P + "--mk");
        ogeler.forEach((o) => {
          o.addEventListener("pointermove", (e) => {
            const r = o.getBoundingClientRect();
            o.style.setProperty("--mx", ((e.clientX - r.left - r.width / 2) * 0.3).toFixed(1) + "px");
            o.style.setProperty("--my", ((e.clientY - r.top - r.height / 2) * 0.4).toFixed(1) + "px");
          });
          o.addEventListener("pointerleave", () => { o.style.setProperty("--mx", "0px"); o.style.setProperty("--my", "0px"); });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
      miknatis(s, P, az);
    });
  })();
</script>
